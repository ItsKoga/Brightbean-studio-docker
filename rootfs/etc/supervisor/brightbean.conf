[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:postgres]
command=gosu %(ENV_APP_USER)s postgres -D %(ENV_PGDATA)s -c listen_addresses=127.0.0.1
autostart=%(ENV_EMBEDDED_DB)s
autorestart=true
priority=10
stopsignal=INT
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; No --max-requests: see upstream Dockerfile (gthread + long uploads).
[program:web]
command=/usr/local/bin/bb-run gunicorn config.wsgi:application --bind 0.0.0.0:%(ENV_PORT)s --workers %(ENV_GUNICORN_WORKERS)s --threads %(ENV_GUNICORN_THREADS)s --access-logfile -
autostart=true
autorestart=true
priority=20
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=/usr/local/bin/bb-run python manage.py run_studio_worker
autostart=true
autorestart=true
priority=30
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
